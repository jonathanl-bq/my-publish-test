name: Release
on:
  release:
    types: published

env:
  CARGO_TERM_COLOR: always
permissions:
  actions: write
  contents: write
  deployments: write
  packages: write
  pull-requests: write
  repository-projects: write

jobs:
  tests:
    name: "Run tests"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1
      - name: Run tests
        run: cargo test
  release:
    needs: tests
    name: "Build And Release"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1
      - name: Publish crates
        run: cargo publish
